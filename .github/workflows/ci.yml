name: FloodGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: floodguard-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax and source validation
        run: npm run check

      - name: Verify private administration routes
        run: npm test

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f bot.js
          test -f src/firebase.js
          test -f src/floodguard.js
          test -f src/store.js
          test -f src/webUi.js
          test -f package.json
          echo "FloodGuard project structure verified."

      - name: Audit production dependencies (high severity)
        run: npm audit --omit=dev --audit-level=high
