name: FloodGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: floodguard-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax and source validation
        run: npm run check

      - name: Verify private administration routes
        run: npm test

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f bot.js
          test -f src/firebase.js
          test -f src/floodguard.js
          test -f src/store.js
          test -f src/webUi.js
          test -f package.json
          echo "FloodGuard project structure verified."

      - name: Audit production dependencies (high severity)
        run: npm audit --omit=dev --audit-level=high
