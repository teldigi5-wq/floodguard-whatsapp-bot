name: FloodGuard Offline Browser E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/demo*.js'
      - 'src/adminAccess.js'
      - 'src/hosting.js'
      - 'scripts/verify-demo-browser.cjs'
      - '.github/workflows/demo-browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/demo*.js'
      - 'src/adminAccess.js'
      - 'src/hosting.js'
      - 'scripts/verify-demo-browser.cjs'
      - '.github/workflows/demo-browser-e2e.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup patched Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Verify available browser engine
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium
          (google-chrome --version || chromium --version)

      - name: Run actual headless Chrome against protected localhost demo
        run: node scripts/verify-demo-browser.cjs
