name: Deploy FloodGuard to EC2
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd ~/floodguard-whatsapp-bot
            git fetch origin
            git reset --hard origin/main
            npm ci --omit=dev || npm install --omit=dev
            pm2 restart floodguard-whatsapp-bot --update-env || pm2 start ecosystem.config.js
            pm2 save
