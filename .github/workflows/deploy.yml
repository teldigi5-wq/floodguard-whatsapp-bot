name: Deploy FloodGuard to EC2

on:
  # Explicit owner action only; avoid unnoticed production changes on each main push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_KEY: ${{ secrets.EC2_KEY }}

    steps:
      - name: Check EC2 deployment configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$EC2_HOST" && -n "$EC2_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "EC2 deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EC2 deployment skipped because EC2_HOST and/or EC2_KEY are not configured in repository Actions secrets."
          fi

      - name: Deploy to EC2
        if: steps.config.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.EC2_HOST }}
          username: ec2-user
          key: ${{ env.EC2_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            cd ~/floodguard-whatsapp-bot
            # Fail before touching the running checkout if the private admin token has
            # not been provisioned. No secrets are written to logs.
            node -e "require('dotenv').config(); const t=process.env.FLOODGUARD_SETUP_TOKEN || ''; if(t.length < 32 || t.length > 512 || !/^[!-~]+$/.test(t)) { console.error('Secure administration token missing; deployment aborted before git reset.'); process.exit(1); }"
            # Fail closed on unsupported or unpatched Node lines before changing the checkout.
            node -e "const v=process.versions.node.split('.').map(Number); const ok=(v[0]===22&&(v[1]>23||(v[1]===23&&v[2]>=4)))||(v[0]===24&&(v[1]>22||(v[1]===22&&v[2]>=1))); if(!ok){console.error('Patched Node LTS 22.23.4+ or 24.22.1+ is required'); process.exit(1)}"
            git fetch origin main
            git reset --hard origin/main
            npm ci --omit=dev
            pm2 restart floodguard-whatsapp-bot --update-env || pm2 start ecosystem.config.js
            pm2 save
