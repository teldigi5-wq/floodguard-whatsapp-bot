name: FloodGuard Windows PC setup validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc:
    name: Windows startup configuration and offline tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and run offline tests
        run: |
          npm ci
          npm test
      - name: Validate PowerShell PC setup and idempotence
        shell: pwsh
        run: |
          ./scripts/setup-windows.ps1
          if (!(Test-Path -LiteralPath '.env')) { throw 'Windows setup did not create .env' }
          if (!(Test-Path -LiteralPath 'data')) { throw 'Windows setup did not create data directory' }
          $settings = Get-Content '.env' -Raw
          if ($settings -notmatch '(?m)^FLOODGUARD_HOST_MODE=pc\r?$') { throw 'Wrong Windows profile' }
          if ($settings -notmatch '(?m)^HOST=127\.0\.0\.1\r?$') { throw 'Windows admin listener not loopback' }
          if ($settings -notmatch '(?m)^FLOODGUARD_SETUP_TOKEN=[A-F0-9]{64}\r?$') { throw 'Windows random setup token missing or weak' }
          npm run doctor
          if ($LASTEXITCODE -ne 0) { throw 'Offline readiness preflight did not pass' }
          $before = (Get-FileHash '.env' -Algorithm SHA256).Hash
          ./scripts/setup-windows.ps1
          $after = (Get-FileHash '.env' -Algorithm SHA256).Hash
          if ($before -ne $after) { throw 'Windows setup unexpectedly overwrote existing settings' }
          # Offline demo works without WhatsApp QR, Firebase or physical hardware.
          $headers = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(('admin:' + (($settings -split "`n" | Where-Object { $_ -match '^FLOODGUARD_SETUP_TOKEN=' } | Select-Object -First 1) -replace '^FLOODGUARD_SETUP_TOKEN=','').Trim()))) }
          $proc = Start-Process -FilePath 'node' -ArgumentList 'scripts/start-demo.js' -PassThru -NoNewWindow
          try {
            Start-Sleep -Seconds 3
            $result = Invoke-RestMethod -Uri 'http://127.0.0.1:8085/status' -Headers $headers
            if ($result.whatsapp -ne 'DEMO_MODE' -or $result.hasQr -ne $false) { throw 'Unexpected live WhatsApp status from offline demo' }
            try { Invoke-WebRequest -Uri 'http://127.0.0.1:8085/qr' -Headers $headers -ErrorAction Stop; throw 'Offline demo unexpectedly exposes a QR' } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          } finally { if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force } }
          Write-Host 'Windows PC setup smoke tests passed (no secrets printed).'
      - name: Rehearse synthetic backup, tamper rejection and cleanup
        shell: pwsh
        run: |
          npm run drill:offline
          if ($LASTEXITCODE -ne 0) { throw 'Offline synthetic backup/restore drill failed' }
      - name: Rehearse isolated demo process restart twice
        shell: pwsh
        run: ./scripts/test-demo-recovery.ps1
